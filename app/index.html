<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>トレサ記録</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="トレサ記録">
<meta name="theme-color" content="#2f5d3a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbzYOberL4ism8_tXnOxqbP55w3zgyWQmZ4OvXduFaShouOzNrJ98CVvIuRjPHYMedT-/exec';
  var KEY = 'tresa_entry_session_v1'; // 見本版と同じサイトなので、見本版の保存とは別の名前にする
  var isHome = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  var frame = null, timer = null;
  // トレサの枠とログイン情報を受け渡す（ホーム画面のアプリでも残るよう、このページ側に保存する）
  window.addEventListener('message', function (e) {
    try {
      // このページの枠の中にいるトレサからのものだけ受け取る
      if (!e.source || e.source.top !== window || !e.data) return;
      if (!/-script\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) return;
      if (e.data.type === 'tresa-get') {
        ready();
        var v = JSON.parse(localStorage.getItem(KEY) || 'null');
        e.source.postMessage({ type: 'tresa-session', session: v }, e.origin);
      } else if (e.data.type === 'tresa-set') {
        var s = e.data.session;
        if (s && typeof s.token === 'string') localStorage.setItem(KEY, JSON.stringify(s));
      } else if (e.data.type === 'tresa-clear') {
        localStorage.removeItem(KEY);
      }
    } catch (err) {}
  });
  function ready() {
    clearTimeout(timer);
    var w = document.getElementById('wait');
    if (w) w.remove();
    if (frame) frame.style.visibility = 'visible';
  }
  function failed() {
    var w = document.getElementById('wait');
    if (!w) return;
    w.innerHTML = '<p>開けませんでした。電波のよい場所で、もう一度試してください。</p>' +
      '<button class="open" onclick="openApp()">もう一度開く</button>' +
      '<a class="other" href="' + APP + '" target="_top">別の開き方で開く</a>';
  }
  function openApp() {
    clearTimeout(timer);
    document.body.textContent = '';
    var w = document.createElement('div');
    w.id = 'wait'; w.innerHTML = '<p>読み込み中…</p>';
    document.body.appendChild(w);
    frame = document.createElement('iframe');
    frame.src = APP; frame.title = 'トレサ記録';
    frame.setAttribute('allow', 'geolocation *');
    frame.style.visibility = 'hidden';
    document.body.appendChild(frame);
    timer = setTimeout(failed, 15000);
  }
  if (isHome) document.addEventListener('DOMContentLoaded', openApp);
</script>
<style>
  :root { --bg:#f6f4ef; --ink:#1d2a3a; --sub:#5f6873; --green:#2f5d3a; --card:#fff; --line:#e2ded5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181e; --ink:#e8ecf1; --sub:#a4adb8; --card:#1d232b; --line:#2c343e; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Hiragino Sans",sans-serif; line-height:1.6; }
  main { max-width:420px; margin:0 auto; padding:32px 16px; text-align:center; }
  img { width:96px; height:96px; border-radius:22px; }
  h1 { font-size:24px; margin:12px 0 20px; }
  .open { display:block; width:100%; border:0; background:var(--green); color:#fff; text-decoration:none; font-size:18px; font-weight:700; padding:16px; border-radius:12px; }
  #wait { max-width:420px; margin:0 auto; padding:64px 16px; text-align:center; }
  .other { display:block; margin-top:16px; color:var(--green); }
  .how { text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:20px; }
  .how h2 { font-size:16px; margin:0 0 8px; }
  .how ol { margin:0; padding-left:22px; }
  .note { color:var(--sub); font-size:14px; margin:12px 0 0; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; }
</style>
</head>
<body>
<main>
  <img src="apple-touch-icon.png" alt="">
  <h1>トレサ記録</h1>
  <a class="open" href="#" onclick="openApp();return false">アプリを開く</a>
  <section class="how">
    <h2>最初に、ホーム画面に追加してください</h2>
    <ol>
      <li>Safariの共有ボタンを押す</li>
      <li>「ホーム画面に追加」を押す</li>
      <li>次からは、ヤギのアイコンから開けます</li>
    </ol>
    <p class="note">アプリの上に出る英語の注意書きは、Googleが自動で表示するものです。問題ありません。</p>
  </section>
</main>
</body>
</html>
