<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>トレサ記録（見本）</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#fff; --ink:#1d2a3a; --sub:#6b7480; --line:#e2ded5;
    --navy:#1f3d6b; --navy-soft:#e7edf6; --gold:#d6a24a; --ok:#2f7d4f; --ok-soft:#e5f3ea; --warn:#b4532a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14181e; --card:#1d232b; --ink:#e8ecf1; --sub:#9aa4b0; --line:#2c343e;
      --navy:#8fb1e6; --navy-soft:#22324a; --gold:#e0b25e; --ok:#6fcf97; --ok-soft:#1f3a2b; --warn:#e8916b; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.5}
  header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:10px 16px}
  @media (prefers-color-scheme: dark){ header{background:#1a2b45} }
  header h1{margin:0;font-size:17px;font-weight:700}
  header .brand{font-size:12px;opacity:.85}
  .who{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:13px}
  .who select{flex:1;font-size:14px;padding:4px 6px;border-radius:6px;border:0}
  nav{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:76px;z-index:4}
  nav button{flex:1;padding:12px 0;border:0;background:none;font-size:15px;color:var(--sub);border-bottom:3px solid transparent}
  nav button.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:700}
  main{max-width:640px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .stages{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stage{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;font-size:15px;color:var(--ink)}
  .stage b{display:block;font-size:16px}
  .stage small{color:var(--sub)}
  .stage .num{display:inline-block;background:var(--navy-soft);color:var(--navy);border-radius:6px;padding:0 6px;font-size:12px;margin-bottom:4px}
  label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
  input,select,textarea{width:100%;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  textarea{min-height:64px}
  .row{display:flex;gap:8px;align-items:center}
  .btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;margin-top:16px}
  @media (prefers-color-scheme: dark){ .btn{color:#10151c} }
  .btn.sub{background:var(--navy-soft);color:var(--navy)}
  .back{background:none;border:0;color:var(--navy);font-size:15px;padding:0;margin-bottom:8px}
  .seg{display:flex;background:var(--navy-soft);border-radius:10px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;border:0;background:none;padding:8px 0;border-radius:8px;font-size:14px;color:var(--navy)}
  .seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.1)}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .chip{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--line);color:var(--sub)}
  .chip.done{background:var(--ok-soft);color:var(--ok)}
  .item{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;cursor:pointer}
  .item .id{font-weight:700;font-size:18px;color:var(--navy)}
  .muted{color:var(--sub);font-size:13px}
  .kv{display:grid;grid-template-columns:40% 60%;gap:4px 8px;font-size:14px}
  .kv div:nth-child(odd){color:var(--sub)}
  .photo{max-width:100%;border-radius:8px;margin-top:6px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;display:none;z-index:9}
  .note{font-size:12px;color:var(--warn);margin-top:4px}
  .checks label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px;margin:6px 0}
  .checks input{width:auto}
  h2{font-size:17px;margin:0 0 4px}
  .demo{font-size:12px;background:var(--gold);color:#3a2a08;text-align:center;padding:3px}
  .mini{display:flex;gap:6px;margin-top:6px}
  .mini button{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--navy-soft);color:var(--navy);font-size:14px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;flex-direction:column;padding:12px}
  .modal .box{background:var(--card);border-radius:12px;flex:1;display:flex;flex-direction:column;overflow:hidden}
  .modal .bar{display:flex;gap:8px;padding:10px;align-items:center}
  .modal .bar span{flex:1;font-size:13px;color:var(--sub)}
  .modal .bar button{padding:8px 14px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-size:15px}
  .modal .bar button.sub{background:var(--navy-soft);color:var(--navy)}
  #map{flex:1}
  .auto{background:var(--navy-soft)}
  .stage:disabled{opacity:.45}
  .who button{border:0;border-radius:6px;padding:3px 10px;font-size:13px;background:rgba(255,255,255,.2);color:#fff}
  .who span{flex:1}
  .link{background:none;border:0;color:var(--navy);font-size:13px;padding:0;margin-top:12px;text-decoration:underline}
</style>

<body>

  <h1>トレサ記録</h1>

<main id="main"></main>

<script>
/* ===================== データの置き場 =====================
   Google上では google.script.run（Code.gs）を使い、
   このMacで開いたときは、ブラウザの中だけで動く「お試し用」を使う。 */
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;

/* 島（頭文字＝個体番号の先頭・耳票の色・地図の中心） 小宝島には野生化トカラヤギはいない */
const ISLANDS = [
  {name:'口之島', code:'口', tag:'', lat:29.97, lng:129.92},
  {name:'中之島', code:'中', tag:'黄', lat:29.85, lng:129.86},
  {name:'平島', code:'平', tag:'', lat:29.69, lng:129.53},
  {name:'諏訪之瀬島', code:'諏', tag:'', lat:29.62, lng:129.71},
  {name:'悪石島', code:'悪', tag:'', lat:29.46, lng:129.60},
  {name:'宝島', code:'宝', tag:'', lat:29.15, lng:129.21}
];
const AGES = ['1歳','2歳','3歳','4歳','5歳以上','不明'];
const GRADE_BY_AGE = {'1歳':'清級','2歳':'清級','3歳':'香級','4歳':'香級','5歳以上':'等外'};
/* auto：入力する人の登録情報などから自動で入る（あとで書き換えも可）
   name=担当者名／island・farm・plant・processor・seller=担当者の登録内容／fixed=決まった値 */
const MOCK_CONFIG = {
  appName: '見本（データはテスト用）',
  stages: [
    { id:'s1', no:'1・2', name:'捕獲・搬出', owner:'捕獲担当', target:'animal', fields:[
      {key:'photo', label:'個体の写真', type:'photo'},
      {key:'sex', label:'性別', type:'select', options:['オス','メス']},
      {key:'age', label:'推定年齢', type:'select', options:AGES, hint:'1〜2歳＝清級／3〜4歳＝香級／5歳以上・推定不可＝等外（商品区分に自動で入ります）。不明のときは受入で歯の写真とダブルチェック'},
      {key:'feature', label:'毛色・身体的特徴', type:'textarea'},
      {key:'island', label:'捕獲地域（十島村内）', type:'island', auto:'island'},
      {key:'tag', label:'耳票の色', type:'text', auto:'tag'},
      {key:'spot', label:'捕獲地点（GPS）', type:'gps'},
      {key:'capDate', label:'捕獲日', type:'date'},

      {key:'tickDate', label:'ダニ駆除剤塗布日', type:'date'},
      {key:'catcher', label:'捕獲者', type:'text', auto:'name'},
      {key:'capHealth', label:'捕獲時の健康状態', type:'textarea'},
      {key:'outDate', label:'搬出日', type:'date'},
      {key:'outFrom', label:'搬出元', type:'text', auto:'outFrom'},

      {key:'inDate', label:'導入日', type:'date'},

      {key:'ageCheck', label:'推定年齢（受入時のダブルチェック）', type:'select', options:AGES},
      {key:'feed', label:'飼料・給餌内容', type:'textarea'},

    ]},
    { id:'s4', no:'4', name:'出荷・と畜', owner:'屠畜場担当', target:'animal', fields:[
      {key:'shipWeight', label:'出荷時体重（kg）', type:'number'},
      {key:'shipDate', label:'出荷日', type:'date'},
      {key:'plant', label:'食肉処理施設名', type:'text', auto:'plant'},
      {key:'slRecord', label:'と畜・解体に関する管理記録', type:'textarea'},
      {key:'inspect', label:'食肉検査等の記録', type:'textarea'},
      {key:'carcass', label:'枝肉重量（kg）', type:'number'},
      {key:'handler', label:'処理担当者', type:'text', auto:'name'}
    ]},
    { id:'s5', no:'5', name:'精肉・品質', owner:'精肉担当', target:'animal', fields:[
      {key:'grade', label:'商品区分', type:'select', options:['香級','清級','等外'], auto:'grade'},
      {key:'meatPlace', label:'精肉場', type:'text', auto:'meat'},
      {key:'storage', label:'熟成・保存条件', type:'textarea'},
      {key:'quality', label:'品質検査記録', type:'textarea'}
    ]},
    { id:'s6', no:'6', name:'加工・製造', owner:'加工担当', target:'lot', fields:[
      {key:'maker', label:'加工事業者', type:'text', auto:'processor'},
      {key:'facility', label:'製造施設', type:'text', auto:'processor'},
      {key:'procDate', label:'加工日', type:'date'},
      {key:'product', label:'加工品名', type:'text', hint:'例：島ヤギ皮ジャーキー'},
      {key:'rawQty', label:'原材料使用量（kg）', type:'number'},
      {key:'additives', label:'添加原材料・調味料', type:'textarea'},
      {key:'qty', label:'製造数量', type:'number'},
      {key:'expiry', label:'賞味期限・消費期限', type:'date'},
      {key:'keep', label:'保存方法', type:'text'},
      {key:'labelText', label:'商品ラベル・表示内容', type:'textarea'}
    ]},
    { id:'s7', no:'7', name:'販売', owner:'販売元', target:'sale', fields:[
      {key:'seller', label:'販売元', type:'text', auto:'seller'},
      {key:'shipDate', label:'出荷日', type:'date'},
      {key:'shipQty', label:'出荷数量', type:'number'},
      {key:'buyer', label:'販売先・納品先', type:'text'},
      {key:'saleDate', label:'販売日', type:'date'},
      {key:'saleQty', label:'販売数量（店舗陳列数）', type:'number'},
      {key:'form', label:'販売形態', type:'select', options:['店舗陳列','飲食店へ納品','直売','イベント出店','通販','その他']}
    ]}
  ]
};
/* 担当者の登録項目 */
const STAFF_FIELDS = [
  {key:'name', label:'氏名'}, {key:'phone', label:'電話番号（電話番号でログインするとき）'},
  {key:'island', label:'捕獲地域（島名）', type:'island'}, {key:'farm', label:'管理牧場'},
  {key:'plant', label:'利用屠畜場'}, {key:'meat', label:'精肉場'},
  {key:'processor', label:'加工場'}, {key:'seller', label:'販売店'}
];
/* 担当の種類：入力できる区分と、登録が必須の項目（氏名はすべて必須） */
const ROLES = [
  {key:'capture', label:'捕獲者', stages:['s1'], need:['island']},
  {key:'receive', label:'受入者', stages:['s3'], need:['farm']},
  {key:'process', label:'処理担当', stages:['s4','s5'], need:['plant','meat']},
  {key:'make', label:'加工者', stages:['s6'], need:['processor']},
  {key:'sell', label:'販売者', stages:['s7'], need:['seller']}
];
const fieldLabel = k => STAFF_FIELDS.find(f => f.key === k).label;
const norm = v => String(v ?? '').replace(/[\s\u3000]/g, '');
const digits = v => String(v ?? '').normalize('NFKC').replace(/\D/g, '');
function findStaff(list, id){
  const n = norm(id), d = digits(id);
  return (list || []).find(s => norm(s.name) === n || (s.phone && d.length >= 9 && digits(s.phone) === d)) || null;
}

function mockSeed(){
  const t = '2026-11-03T10:00:00';
  const M = '美延 優志', S = '白石 聡';
  return {
    staff:[
      {name:M, roles:['capture'], phone:'', island:'中之島', farm:'', plant:'', meat:'', processor:'', seller:''},
      {name:S, roles:['receive','process','make','sell'], phone:'', island:'', farm:'サティ牧場', plant:'小湊屠畜場', meat:'（仮）精肉場', processor:'らいおんの穴', seller:'らいおんのアナ'}
    ],
    animals:['中A001','中A002','中A003'],
    records:[
      {target:'animal',id:'中A001',stage:'s1',by:M,at:t,data:{sex:'オス',age:'3歳',feature:'茶色・右角が短い',island:'中之島',tag:'黄',spot:'29.8512, 129.8601',capDate:'2026-09-20',tickDrug:'（ダミー）',tickDate:'2026-09-21',catcher:M,capHealth:'良好',outDate:'2026-09-25',outFrom:'中之島',outTo:'奄美大島',receiver:S}},
      {target:'animal',id:'中A001',stage:'s3',by:S,at:t,data:{farm:'サティ牧場・'+S,inDate:'2026-09-26',inWeight:'18',inHealth:'良好',ageCheck:'3歳',feed:'島の野草・干し草',medic:'なし',method:'放牧＋天然草'}},
      {target:'animal',id:'中A001',stage:'s4',by:S,at:t,data:{shipWeight:'24',shipDate:'2026-10-28',plant:'小湊屠畜場',carcass:'11',handler:S}},
      {target:'animal',id:'中A001',stage:'s5',by:S,at:t,data:{grade:'香級',meatPlace:'（仮）精肉場',storage:'冷凍 -20℃'}},
      {target:'animal',id:'中A002',stage:'s1',by:M,at:t,data:{sex:'メス',age:'不明',island:'中之島',tag:'黄',capDate:'2026-10-05',catcher:M,outDate:'2026-10-10',outFrom:'中之島',outTo:'奄美大島',receiver:S}},
      {target:'animal',id:'中A002',stage:'s3',by:S,at:t,data:{farm:'サティ牧場・'+S,inDate:'2026-10-11',inWeight:'15',ageCheck:'不明'}},
      {target:'animal',id:'中A003',stage:'s1',by:M,at:t,data:{sex:'オス',age:'2歳',island:'中之島',tag:'黄',capDate:'2026-10-30'}},
      {target:'lot',id:'中A001-1',stage:'s6',by:S,at:t,data:{maker:'らいおんの穴',facility:'らいおんの穴',procDate:'2026-10-30',product:'島ヤギ皮ジャーキー',qty:'40',expiry:'2027-04-30',keep:'常温・直射日光を避ける'}},
      {target:'sale',id:'中A001-1',stage:'s7',by:S,at:t,data:{seller:'らいおんのアナ',shipDate:'2026-11-01',shipQty:'10',buyer:'（ダミー）島内スーパー',saleDate:'2026-11-01',saleQty:'10',form:'店舗陳列'}}
    ],
    lots:[{lot:'中A001-1',animals:['中A001'],at:t}]
  };
}
const MOCK_KEY = 'tresa_mock_v3', PW_KEY = 'tresa_pw_v1', SESSION_KEY = 'tresa_session_v1';
function mockLoad(){ try{ const s = localStorage.getItem(MOCK_KEY); if(s) return JSON.parse(s); }catch(e){} return mockSeed(); }
function mockSave(db){ try{ localStorage.setItem(MOCK_KEY, JSON.stringify(db)); }catch(e){} }
function pwLoad(){ try{ return JSON.parse(localStorage.getItem(PW_KEY)) || {}; }catch(e){ return {}; } }
function pwSave(m){ try{ localStorage.setItem(PW_KEY, JSON.stringify(m)); }catch(e){} }
async function sha(text){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}

const api = {
  call(fn, ...args){
    if(IS_GAS){
      return new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[fn](...args));
    }
    return Promise.resolve(mock[fn](...args));
  }
};
/* お試し用：Code.gs と同じ呼び方。見本版はそのスマホの中だけで動く（token は名前そのもの） */
const mock = {
  getConfig(){ return MOCK_CONFIG; },
  getAll(){ return mockLoad(); },
  async login(id, pw){
    const s = findStaff(mockLoad().staff, id); if(!s) return {error:'登録されていない氏名・電話番号です'};
    const m = pwLoad(); if(!m[s.name]) return {setup:true, name:s.name};
    return m[s.name] === await sha(s.name + '|' + pw) ? {name:s.name, token:s.name} : {error:'パスワードが違います'};
  },
  async setPassword(id, pw){
    const s = findStaff(mockLoad().staff, id); if(!s) return {error:'登録されていない氏名・電話番号です'};
    const m = pwLoad(); if(m[s.name]) return {error:'パスワードは設定済みです'};
    m[s.name] = await sha(s.name + '|' + pw); pwSave(m); return {name:s.name, token:s.name};
  },
  resetPassword(id){ const s = findStaff(mockLoad().staff, id); if(!s) return false; const m = pwLoad(); delete m[s.name]; pwSave(m); return true; },
  logout(){ return true; },
  addAnimal(token, id){ const db = mockLoad(); if(!db.animals.includes(id)) db.animals.push(id); mockSave(db); return id; },
  saveRecord(token, rec){ const db = mockLoad(); rec.by = token; rec.at = new Date().toISOString(); db.records.push(rec); mockSave(db); return true; },
  saveStaffOne(token, s, isNew){ const db = mockLoad(); const i = db.staff.findIndex(x => x.name === s.name);
    if(isNew){ if(i >= 0) throw new Error('同じ氏名の担当者がいます'); db.staff.push(s); }
    else { if(s.name !== token || i < 0) throw new Error('本人の情報だけ編集できます'); db.staff[i] = s; }
    mockSave(db); return true; },
  createLot(token, animals){ const db = mockLoad(); const base = animals[0];
    const n = db.lots.filter(l => l.lot.startsWith(base + '-')).length + 1;
    const lot = base + '-' + n; db.lots.push({lot, animals, at:new Date().toISOString()}); mockSave(db); return lot; }
};

/* ===================== 画面 ===================== */
let CFG = null, DB = null, VIEW = 'input', LISTMODE = 'animal', USER = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1800); }
const stageOf = id => CFG.stages.find(s => s.id === id);
const islandOf = name => ISLANDS.find(i => i.name === name);
const islandByCode = code => ISLANDS.find(i => i.code === code);
const me = () => (DB?.staff || []).find(s => s.name === USER?.name) || null;

function latest(target, id, stage){
  const rs = DB.records.filter(r => r.target === target && r.id === id && r.stage === stage);
  if(!rs.length) return null;
  const merged = {}; rs.forEach(r => Object.assign(merged, r.data)); // 後から入れた値で上書き
  return {data: merged, by: rs[rs.length-1].by, at: rs[rs.length-1].at};
}
// 個体番号＝島の頭文字＋アルファベット＋番号（中A001〜中A100 → 中B001〜）。島ごとに連番
function nextAnimalId(code){
  let max = -1;
  DB.animals.forEach(id => { const m = /^(.)([A-Z])(\d{3})$/.exec(id); if(m && m[1] === code){ const v = (m[2].charCodeAt(0)-65)*100 + (+m[3]-1); if(v > max) max = v; } });
  const v = max + 1; return code + String.fromCharCode(65 + Math.floor(v/100)) + String(v%100 + 1).padStart(3,'0');
}
// 年齢が推定できない個体（捕獲時も受入時も「不明」または未入力で、どちらかが不明）は等外
function ageUnknown(a){
  const s1 = latest('animal', a, 's1')?.data || {}, s3 = latest('animal', a, 's3')?.data || {};
  const known = v => v && v !== '不明';
  return !known(s3.ageCheck) && !known(s1.age) && (s1.age === '不明' || s3.ageCheck === '不明');
}

// 等級に使う年齢：受入時のダブルチェックを優先し、なければ捕獲時の推定年齢
function ageBest(a){
  const s1 = latest('animal', a, 's1')?.data || {}, s3 = latest('animal', a, 's3')?.data || {};
  const known = v => v && v !== '不明';
  return known(s3.ageCheck) ? s3.ageCheck : known(s1.age) ? s1.age : '';
}
function gradeOf(a){ return ageUnknown(a) ? '等外' : (GRADE_BY_AGE[ageBest(a)] || ''); }

// 自動で入れる値（前回の入力がないときだけ使う）
function autoVal(f, id){
  const p = me() || {};
  const isl = islandByCode(String(id)[0]);
  switch(f.auto){
    case 'name': return p.name || '';
    case 'island': return isl ? isl.name : (p.island || '');
    case 'tag': return isl ? isl.tag : '';
    case 'outFrom': return isl ? isl.name : '';
    case 'fixed': return f.value || '';
    case 'farm': return p.farm ? p.farm + '・' + p.name : '';
    case 'plant': case 'meat': case 'processor': case 'seller': return p[f.auto] || '';
    case 'grade': return gradeOf(id);
  }
  return '';
}
function fieldHtml(f, val, isAuto){
  const v = esc(val || ''); const cls = isAuto && val ? ' class="auto"' : '';

  if(f.type === 'island') return islandSelect('f_' + f.key, val, `data-k="${f.key}"${cls} onchange="islandChanged(this.value)"`);
  if(f.type === 'staff') return `<select data-k="${f.key}"><option value=""></option>` + (DB.staff || []).map(s => `<option ${s.name===val?'selected':''}>${esc(s.name)}</option>`).join('') + `</select>`;

  if(f.type === 'gps') return `<input type="text" data-k="${f.key}" value="${v}" placeholder="例：29.8512, 129.8601" inputmode="decimal">

function readPhoto(file){
  return new Promise(ok => {
    const img = new Image(), r = new FileReader();
    r.onload = () => { img.onload = () => { const c = document.createElement('canvas'); const k = Math.min(1, 800 / Math.max(img.width, img.height));
      c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', .75)); }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}
async function saveForm(stageId, id){

    if(el.value !== '') data[el.dataset.k] = el.value;
  }
  if(data.spot && !GPS_OK.test(data.spot)){ toast('捕獲地点は「緯度, 経度」の形で入れてください'); return; }
  if(!Object.keys(data).length){ toast('何も入力されていません'); return; }
  await api.call('saveRecord', USER.token, {target: s.target, id, stage: stageId, data});
  await refresh(); toast('保存しました'); go('input');
}

const GPS_OK = /^-?\d{1,2}\.\d+, ?-?\d{1,3}\.\d+$/;
const fmt = (lat, lng) => lat.toFixed(5) + ', ' + lng.toFixed(5);
function gpsHere(key){
  if(!navigator.geolocation){ toast('この端末では位置が取れません'); return; }
  toast('位置を取得中…');
  navigator.geolocation.getCurrentPosition(p => { document.querySelector(`[data-k="${key}"]`).value = fmt(p.coords.latitude, p.coords.longitude); toast('今いる場所を入れました'); },
    () => toast('位置が取れませんでした（位置情報の許可を確認してください）'), {enableHighAccuracy:true, timeout:15000});
}
let leafletLoading = null;
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  return leafletLoading ||= new Promise((ok, ng) => { const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; s.integrity = 'sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=='; s.crossOrigin = 'anonymous'; s.onload = ok; s.onerror = ng; document.head.appendChild(s); });
}
async function gpsMap(key){
  const input = document.querySelector(`[data-k="${key}"]`);
  try{ await loadLeaflet(); }catch(e){ toast('地図を読み込めませんでした'); return; }
  const isl = islandOf(document.querySelector('[data-k="island"]')?.value) || ISLANDS[1];
  let pos = GPS_OK.test(input.value) ? input.value.split(',').map(Number) : null;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box"><div class="bar"><span id="mapMsg">捕獲した場所を地図で押してください</span><button class="sub" id="mapNo">やめる</button><button id="mapOk">決定</button></div><div id="map"></div></div>`;
  document.body.appendChild(m);
  const map = L.map('map').setView(pos || [isl.lat, isl.lng], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
  let mk = pos ? L.marker(pos).addTo(map) : null;
  map.on('click', e => { pos = [e.latlng.lat, e.latlng.lng]; mk ? mk.setLatLng(pos) : (mk = L.marker(pos).addTo(map)); $('#mapMsg').textContent = fmt(pos[0], pos[1]); });
  $('#mapNo').onclick = () => m.remove();
  $('#mapOk').onclick = () => { if(!pos){ toast('地図を押して場所を選んでください'); return; } input.value = fmt(pos[0], pos[1]); m.remove(); };
}

    if(miss.length){ toast(r.label + 'は' + miss.map(fieldLabel).join('・') + 'が必須です'); return; }
  }
  const others = (DB.staff || []).filter((x, j) => j !== i);
  if(others.some(x => norm(x.name) === norm(s.name))){ toast('同じ氏名の担当者がいます'); return; }
  if(s.phone && others.some(x => x.phone && digits(x.phone) === digits(s.phone))){ toast('同じ電話番号の担当者がいます'); return; }
  try{ await api.call('saveStaffOne', USER.token, s, i < 0); }catch(e){ toast(e.message || '保存できませんでした'); return; }
  await refresh(); toast('保存しました'); go('staff');
}

/* ---- 一覧 ---- */
function showList(){
  const seg = `<div class="seg">${[['animal','1頭ごと'],['lot','ロットごと'],['sale','販売時期']].map(([k,t]) => `<button class="${LISTMODE===k?'on':''}" onclick="LISTMODE='${k}';showList()">${t}</button>`).join('')}</div>`;
  let body = '';
  if(LISTMODE === 'animal'){
    body = `<input id="q" placeholder="番号・島・性別などで探す" oninput="drawAnimals()"><div id="res" style="margin-top:12px"></div>`;
    $('#main').innerHTML = seg + body; drawAnimals(); return;
  }
  if(LISTMODE === 'lot'){
    body = `<input id="q" placeholder="ロット番号・商品名で探す" oninput="drawLots()"><div id="res" style="margin-top:12px"></div>`;
    $('#main').innerHTML = seg + body; drawLots(); return;
  }
  const months = [...new Set(DB.records.filter(r => r.stage === 's7').map(r => (r.data.saleDate || r.data.shipDate || '').slice(0,7)).filter(Boolean))].sort().reverse();
  body = `<select id="m" onchange="drawSales()"><option value="">すべての月</option>${months.map(m => `<option>${m}</option>`).join('')}</select><div id="res" style="margin-top:12px"></div>`;
  $('#main').innerHTML = seg + body; drawSales();
}
function drawAnimals(){
  const q = ($('#q').value || '').trim();
  const rows = DB.animals.slice().reverse().map(a => {
    const s1 = latest('animal', a, 's1')?.data || {};
    const grade = ageUnknown(a) ? '等外' : (latest('animal', a, 's5')?.data.grade || gradeOf(a));
    const text = [a, s1.island, s1.sex, s1.age, s1.capDate, grade].join(' ');
    if(q && !text.includes(q)) return '';
    const chips = CFG.stages.filter(s => s.target === 'animal').map(s => `<span class="chip ${latest('animal', a, s.id) ? 'done' : ''}">${esc(s.name)}</span>`).join('');
    const lots = DB.lots.filter(l => l.animals.includes(a)).map(l => l.lot).join('・');
    return `<div class="card item" onclick="showAnimal('${a}')"><div><div class="id">${a}</div><div class="muted">${esc(s1.sex || '')} ${esc(s1.age || '')} ${esc(s1.island || '')} ${s1.capDate ? '捕獲 ' + esc(s1.capDate) : ''}${grade ? '／' + esc(grade) : ''}${lots ? '／ロット ' + esc(lots) : ''}</div><div class="chips">${chips}</div></div><span class="muted">›</span></div>`;
  }).join('');
  $('#res').innerHTML = rows || '<p class="muted">見つかりません</p>';
}
function drawLots(){
  const q = ($('#q').value || '').trim();
  const rows = DB.lots.slice().reverse().map(l => {
    const p = latest('lot', l.lot, 's6')?.data || {};
    if(q && ![l.lot, p.product].join(' ').includes(q)) return '';
    const sold = DB.records.filter(r => r.stage === 's7' && r.id === l.lot).reduce((n, r) => n + (+r.data.saleQty || 0), 0);
    return `<div class="card item" onclick="showLot('${l.lot}')"><div><div class="id">${l.lot}</div><div class="muted">${esc(p.product || '（商品名まだ）')}／個体 ${esc(l.animals.join('・'))}</div><div class="muted">加工日 ${esc(p.procDate || '-')}・期限 ${esc(p.expiry || '-')}・製造 ${esc(p.qty || '-')}・販売 ${sold}</div></div><span class="muted">›</span></div>`;
  }).join('');
  $('#res').innerHTML = rows || '<p class="muted">見つかりません</p>';
}
function drawSales(){
  const m = $('#m').value;
  const rows = DB.records.filter(r => r.stage === 's7' && (!m || (r.data.saleDate || r.data.shipDate || '').startsWith(m))).slice().reverse().map(r => {
    const p = latest('lot', r.id, 's6')?.data || {};
    return `<div class="card item" onclick="showLot('${r.id}')"><div><div class="id">${esc(r.data.saleDate || r.data.shipDate || '日付なし')}</div><div class="muted">${esc(r.id)}　${esc(p.product || '')}</div><div class="muted">${esc(r.data.buyer || '')}・${esc(r.data.form || '')}・${esc(r.data.saleQty || r.data.shipQty || '-')}個</div></div><span class="muted">›</span></div>`;
  }).join('');
  $('#res').innerHTML = rows || '<p class="muted">この月の販売記録はありません</p>';
}
function cell(f, v){
  if(f.type === 'photo') return `<img class="photo" src="${esc(v)}">`;
  if(f.type === 'gps' && GPS_OK.test(v)) return `<a href="https://www.google.com/maps?q=${encodeURIComponent(v.replace(/ /g,''))}" target="_blank" rel="noopener">${esc(v)}</a>`;
  return esc(v);
}
function kv(stage, d){
  return `<div class="kv">` + stage.fields.filter(f => d[f.key]).map(f => `<div>${esc(f.label)}</div><div>${cell(f, d[f.key])}</div>`).join('') + `</div>`;
}
function showAnimal(a){
  let html = `<button class="back" onclick="go('list')">← 一覧へ</button><div class="card"><h2>${a} の記録</h2>${ageUnknown(a) ? '<p class="note">年齢が推定できていないため等外扱い</p>' : ''}</div>`;
  CFG.stages.filter(s => s.target === 'animal').forEach(s => {
    const r = latest('animal', a, s.id);
    html += `<div class="card"><b>${esc(s.no)}. ${esc(s.name)}</b>${r ? `<div class="muted">${esc(r.by)}・${esc(String(r.at).slice(0,10))}</div>` + kv(s, r.data) : '<div class="muted">まだ入力されていません</div>'}</div>`;
  });
  DB.lots.filter(l => l.animals.includes(a)).forEach(l => { html += `<div class="card item" onclick="showLot('${l.lot}')"><div><b>製造ロット ${l.lot}</b><div class="muted">${esc(latest('lot', l.lot, 's6')?.data.product || '')}</div></div><span class="muted">›</span></div>`; });
  $('#main').innerHTML = html; window.scrollTo(0,0);
}
function showLot(lot){
  const l = DB.lots.find(x => x.lot === lot) || {animals:[]};
  const p = latest('lot', lot, 's6');
  let html = `<button class="back" onclick="go('list')">← 一覧へ</button><div class="card"><h2>ロット ${esc(lot)}</h2><div class="muted">使った個体：${l.animals.map(a => `<a href="#" onclick="showAnimal('${a}');return false">${a}</a>`).join('・')}</div></div>`;
  html += `<div class="card"><b>6. 加工・製造</b>${p ? kv(stageOf('s6'), p.data) : '<div class="muted">まだ入力されていません</div>'}</div>`;
  const sales = DB.records.filter(r => r.stage === 's7' && r.id === lot);
  html += `<div class="card"><b>7. 販売（${sales.length}件）</b>` + (sales.map(r => kv(stageOf('s7'), r.data)).join('<hr style="border:0;border-top:1px solid var(--line)">') || '<div class="muted">まだ販売記録はありません</div>') + `</div>`;
  $('#main').innerHTML = html; window.scrollTo(0,0);
}
boot();
</script>
